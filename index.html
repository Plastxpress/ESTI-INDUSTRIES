          "@type": "Question",
          "name": "Does ESTI Packaging provide UN-certified boxes for hazardous cargo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, ESTI Packaging is certified to manufacture UN 1266 compliant packaging for Class 3 flammable liquids and dangerous goods. Our UN-certified boxes comply with IMDG, ICAO/IATA, and ADR regulations for safe domestic and international transport of hazardous materials."
          }
        },
        {
          "@type": "Question",
          "name": "Where are ESTI Packaging's manufacturing plants located?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ESTI Packaging operates from multiple locations in Maharashtra, India: our corporate office in Deonar, Mumbai (400088), a manufacturing plant in Dheku, Khopoli (410203), and an industrial corridor unit in Shirur-Ranjangaon near Pune. This strategic positioning enables efficient delivery across western India and export ports."
          }
        },
        {
          "@type": "Question",
          "name": "What industries does ESTI Packaging serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ESTI Packaging serves 16+ industries including Heavy Engineering, Automotive, Electrical & Electronics, Pharmaceuticals, FMCG, Food Processing, Agriculture, E-commerce, Logistics, Export & International Shipping, Chemicals & Lubricants, Furniture, Textiles, and Printing & Stationery."

        },

          "@type": "Question",
          "name": "Is ESTI Packaging ISO certified?",
